<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>MarkLine 两阶段渲染 Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
    #chart { width: 900px; height: 500px; }
    h3 { color: #1976D2; }
    .note { color: #888; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>MarkLine 两阶段渲染 Demo</h3>
  <p>实线数据有入场动画，虚线(markLine)在动画结束后补上。</p>
  <div id="chart"></div>
  <p class="note">拆开浏览器控制台看日志或观察：先看到实线从 0 拉到值，虚线在 1 秒后出现。</p>

  <script>
    const chart = echarts.init(document.getElementById('chart'));

    // 模拟 60 天数据，非交易日有 null
    const dates = [];
    const price = [];
    const buzz = [];
    for (let i = 0; i < 60; i++) {
      const d = new Date(2026, 6, 1 + i);
      dates.push(d.toISOString().slice(0, 10));
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      price.push(isWeekend ? null : Math.sin(i * 0.15) * 3 + 20 + i * 0.2);
      buzz.push(20 + Math.random() * 60);
    }

    // 构建 markLine 虚线数据：连接非交易日间隙
    const gapMarkLines = [];
    let gapStart = null;
    for (let i = 0; i < price.length; i++) {
      if (price[i] !== null) {
        if (gapStart !== null) {
          gapMarkLines.push([
            { xAxis: gapStart.idx, yAxis: gapStart.val, symbol: 'none' },
            { xAxis: i, yAxis: price[i], symbol: 'none' }
          ]);
        }
        gapStart = { idx: i, val: price[i] };
      }
    }
    // 末尾连续非交易日：水平虚线
    const lastTrading = price.map((v, i) => v !== null ? i : -1).filter(i => i >= 0).pop();
    if (lastTrading != null && lastTrading < price.length - 1) {
      gapMarkLines.push([
        { xAxis: lastTrading, yAxis: price[lastTrading], symbol: 'none' },
        { xAxis: price.length - 1, yAxis: price[lastTrading], symbol: 'none' }
      ]);
    }

    // ── 第一阶段：不含 markLine ──
    const baseOption = {
      animation: true,
      animationDuration: 1200,
      animationEasing: 'cubicOut',
      tooltip: { trigger: 'axis' },
      legend: { data: ['价格', '热度'], textStyle: { color: '#ccc' } },
      grid: { left: 70, right: 80, top: 40, bottom: 30 },
      xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 9 } },
      yAxis: [
        { type: 'value', name: '价格', nameTextStyle: { color: '#1976D2' } },
        { type: 'value', name: '热度', nameTextStyle: { color: '#FF6B35' } }
      ],
      series: [
        {
          name: '价格',
          type: 'line',
          yAxisIndex: 0,
          data: price,
          smooth: true,
          connectNulls: false,
          lineStyle: { color: '#1976D2', width: 2 },
          markLine: { silent: true, symbol: 'none', data: [] }  // 空，稍后补
        },
        {
          name: '热度',
          type: 'line',
          yAxisIndex: 1,
          data: buzz,
          smooth: true,
          lineStyle: { color: '#FF6B35', width: 2 }
        }
      ]
    };

    chart.setOption(baseOption);

    // ── 第二阶段：动画结束后补 markLine ──
    setTimeout(() => {
      console.log('1s 后补 markLine');
      chart.setOption({
        series: [
          {
            name: '价格',
            markLine: {
              silent: true,
              symbol: 'none',
              lineStyle: { color: '#999', type: 'dashed', width: 1.5 },
              data: gapMarkLines
            }
          }
        ]
      });
    }, 1300);
  </script>
</body>
</html>
