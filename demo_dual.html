<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>双Series叠层 Demo - 实线动画 + 虚线无动画</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
    #chart { width: 960px; height: 520px; }
    h3 { margin-bottom: 4px; }
    .note { color: #888; font-size: 13px; margin: 0 0 10px; }
    .tip { color: #FFB74D; font-size: 13px; }
  </style>
</head>
<body>
  <h3>双 Series 叠层 — 实线有动画 · 虚线无动画立刻到位</h3>
  <p class="note">价格线拆成两层：底层虚线全日历无动画 / 上层实线仅交易日有动画</p>
  <p class="tip">试试：点图例"价格"取消→再点开，动画不走底层；拖 dataZoom 缩放，虚实永不分离</p>
  <div id="chart"></div>

  <script>
    const chart = echarts.init(document.getElementById('chart'));

    // 造 60 天数据，周六日非交易日
    const dates = [], priceFull = [], priceTrading = [];
    let lastPrice = 20;
    for (let i = 0; i < 60; i++) {
      const d = new Date(2026, 6, 1 + i);
      dates.push(d.toISOString().slice(0, 10));
      const isTrading = d.getDay() !== 0 && d.getDay() !== 6;
      if (isTrading) {
        lastPrice += (Math.random() - 0.45) * 1.5;
        priceFull.push(+lastPrice.toFixed(2));
        priceTrading.push(+lastPrice.toFixed(2));
      } else {
        priceFull.push(+lastPrice.toFixed(2)); // 沿用上日
        priceTrading.push(null);
      }
    }

    // 热度（全量有值）
    const buzz = [];
    for (let i = 0; i < 60; i++) buzz.push(+(20 + Math.random() * 60).toFixed(1));

    chart.setOption({
      animation: false,         // 全局关动画，各 series 按需开
      tooltip: { trigger: 'axis' },
      legend: { data: ['价格', '热度'], textStyle: { color: '#ccc' }, top: 8 },
      grid: { left: 70, right: 80, top: 50, bottom: 80 },
      dataZoom: [{ type: 'slider', start: 0, end: 100, bottom: 10, height: 22 }],
      xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 9 } },
      yAxis: [
        { type: 'value', name: '价格', nameTextStyle: { color: '#1976D2' } },
        { type: 'value', name: '热度', nameTextStyle: { color: '#FF6B35' } }
      ],
      series: [
        // 底层虚线 — 全日历，无动画，立刻渲染，图例不显示
        {
          name: '价格底层虚线',
          type: 'line', yAxisIndex: 0, data: priceFull,
          lineStyle: { color: '#1976D2', type: 'dashed', width: 1.5, opacity: 0.55 },
          itemStyle: { color: '#1976D2', opacity: 0 },
          symbol: 'none',
          animation: false,
          showSymbol: false,
          legendHoverLink: false,
        },
        // 上层实线 — 仅交易日，有入场动画，图例显示"价格"
        {
          name: '价格',
          type: 'line', yAxisIndex: 0, data: priceTrading,
          smooth: true,
          connectNulls: false,
          lineStyle: { color: '#1976D2', width: 2.2 },
          symbol: 'circle', symbolSize: 4,
          animation: true,
          animationDuration: 1000,
          animationEasing: 'cubicOut',
        },
        // 热度 — 正常单层
        {
          name: '热度',
          type: 'line', yAxisIndex: 1, data: buzz,
          smooth: true,
          lineStyle: { color: '#FF6B35', width: 2 },
          animation: true,
          animationDuration: 1000,
          animationEasing: 'cubicOut',
        }
      ]
    });
  </script>
</body>
</html>
