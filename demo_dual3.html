<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>双Series叠层 Demo v2 — 修复版</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
    #chart { width: 1000px; height: 580px; }
    h3 { margin: 0 0 2px; }
    .sub { color: #888; font-size: 13px; margin: 0 0 6px; }
    .fix { color: #4CAF50; font-size: 13px; margin: 0 0 10px; }
  </style>
</head>
<body>
  <h3>双 Series 叠层 Demo v2 — Y轴不重叠 · 图例联动虚线 · 零线归位</h3>
  <p class="sub">每条虚线底层 series 通过事件监听联动上层图例，关掉图例虚线跟着消失</p>
  <p class="fix">修复：1) Y轴文字不重叠 2) 零线放进斜率实线 series 3) 图例联动虚线显隐</p>
  <div id="chart"></div>

  <script>
    const chart = echarts.init(document.getElementById('chart'));

    // ── 数据 ──
    const dates = [], closeFull = [], closeTrading = [], volFull = [], volTrading = [],
          slopeFull = [], slopeTrading = [], logFull = [], logTrading = [], buzz = [];
    let c = 20, v = 80000, s = 0, l = Math.log(20);
    for (let i = 0; i < 60; i++) {
      const d = new Date(2026, 6, 1 + i);
      dates.push(d.toISOString().slice(0, 10));
      const ok = d.getDay() !== 0 && d.getDay() !== 6;
      if (ok) { c += (Math.random() - 0.45) * 1.5; v = Math.max(30000, v + (Math.random() - 0.5) * 30000); l = Math.log(c); s = (Math.random() - 0.45) * 0.3; }
      closeFull.push(+c.toFixed(2));   closeTrading.push(ok ? +c.toFixed(2) : null);
      volFull.push(Math.round(v/100));  volTrading.push(ok ? Math.round(v/100) : null);
      logFull.push(+l.toFixed(4));     logTrading.push(ok ? +l.toFixed(4) : null);
      slopeFull.push(+s.toFixed(4));   slopeTrading.push(ok ? +s.toFixed(4) : null);
      buzz.push(+(25 + Math.random() * 55).toFixed(1));
    }

    const nonTradingAreas = [];
    let st = null;
    for (let i = 0; i < 60; i++) {
      if (closeTrading[i] === null) { if (st === null) st = i; }
      else { if (st !== null) { nonTradingAreas.push([{ xAxis: st }, { xAxis: i - 1 }]); st = null; } }
    }
    if (st !== null) nonTradingAreas.push([{ xAxis: st }, { xAxis: 59 }]);

    const dash = (color, w) => ({ color, type: 'dashed', width: w, opacity: 0.4 });
    const sol  = (color, w) => ({ color, width: w });

    // 图例→底层虚线的映射
    const legendToDash = {
      '收盘价':        '__价格底层',
      '成交量(手)':    '__成交量底层',
      '价格斜率(5日)': '__斜率底层',
      '收盘价(对数)':  '__对数底层',
    };

    chart.setOption({
      animation: false,
      tooltip: { trigger: 'axis' },
      legend: {
        data: ['热度指数', '收盘价', '成交量(手)', '价格斜率(5日)', '收盘价(对数)'],
        textStyle: { color: '#ccc' }, top: 6
      },
      grid: { left: 88, right: 300, top: 48, bottom: 80 },
      dataZoom: [{ type: 'slider', start: 0, end: 100, bottom: 10, height: 22 }],
      xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 9, color: '#aaa' } },
      yAxis: [
        { type: 'value', name: '收盘价',      nameTextStyle: { color: '#1976D2' }, nameGap: 14, offset: 0,    axisLabel: { margin: 4 } },
        { type: 'value', name: '成交量(手)',  nameTextStyle: { color: '#FF7043' }, nameGap: 14, offset: 55,   axisLabel: { margin: 4, formatter: v => v >= 10000 ? (v/10000).toFixed(1)+'万' : v } },
        { type: 'value', name: '斜率',        nameTextStyle: { color: '#26A69A' }, nameGap: 14, offset: 110,  axisLabel: { margin: 4 } },
        { type: 'value', name: '对数价格',    nameTextStyle: { color: '#AB47BC' }, nameGap: 14, offset: 165,  axisLabel: { margin: 4 } },
        { type: 'value', name: '热度指数',    nameTextStyle: { color: '#FF6B35' }, nameGap: 14, offset: 220,  axisLabel: { margin: 4 }, min: 0, max: 100 },
      ],
      series: [
        { name: '__价格底层',     type: 'line', yAxisIndex: 0, data: closeFull, smooth: true, symbol: 'none', lineStyle: dash('#1976D2', 1.4), animation: false, legendHoverLink: false },
        { name: '收盘价',         type: 'line', yAxisIndex: 0, data: closeTrading, smooth: true, connectNulls: false, symbol: 'circle', symbolSize: 4, lineStyle: sol('#1976D2', 2.2), animation: true, animationDuration: 1000, animationEasing: 'cubicOut', markArea: { silent: true, data: nonTradingAreas, itemStyle: { color: 'rgba(80,80,80,0.18)' } } },

        { name: '__成交量底层',   type: 'line', yAxisIndex: 1, data: volFull, smooth: true, symbol: 'none', lineStyle: dash('#FF7043', 1.4), animation: false, legendHoverLink: false },
        { name: '成交量(手)',     type: 'line', yAxisIndex: 1, data: volTrading, smooth: true, connectNulls: false, symbol: 'circle', symbolSize: 3, lineStyle: sol('#FF7043', 2.2), animation: true, animationDuration: 1000, animationEasing: 'cubicOut' },

        { name: '__斜率底层',     type: 'line', yAxisIndex: 2, data: slopeFull, smooth: true, symbol: 'none', lineStyle: dash('#26A69A', 1.4), animation: false, legendHoverLink: false },
        { name: '价格斜率(5日)',  type: 'line', yAxisIndex: 2, data: slopeTrading, smooth: true, connectNulls: false, symbol: 'circle', symbolSize: 3, lineStyle: sol('#26A69A', 2.2), animation: true, animationDuration: 1000, animationEasing: 'cubicOut',
          markLine: { silent: true, symbol: 'none', lineStyle: { color: '#666', type: 'dashed', width: 1 }, label: { show: true, formatter: '零线', fontSize: 10 }, data: [{ yAxis: 0 }] } },

        { name: '__对数底层',     type: 'line', yAxisIndex: 3, data: logFull, smooth: true, symbol: 'none', lineStyle: dash('#AB47BC', 1.4), animation: false, legendHoverLink: false },
        { name: '收盘价(对数)',   type: 'line', yAxisIndex: 3, data: logTrading, smooth: true, connectNulls: false, symbol: 'circle', symbolSize: 3, lineStyle: sol('#AB47BC', 2.2), animation: true, animationDuration: 1000, animationEasing: 'cubicOut' },

        { name: '热度指数',       type: 'line', yAxisIndex: 4, data: buzz, smooth: true, symbol: 'circle', symbolSize: 4, lineStyle: sol('#FF6B35', 2.2), animation: true, animationDuration: 1000, animationEasing: 'cubicOut' },
      ]
    });

    // 图例联动：切换图例时同步控制底层虚线
    chart.on('legendselectchanged', function(params) {
      const opt = { series: [] };
      for (const [legendName, dashName] of Object.entries(legendToDash)) {
        const visible = params.selected[legendName];
        // 找到底层虚线 series 的 index
        chart.getOption().series.forEach((s, idx) => {
          if (s.name === dashName) {
            opt.series.push({ name: dashName });
            // 用 setOption 没法直接 set series 可见性，改用 dispatchAction
          }
        });
      }
      // 用 dispatchAction 控制底层虚线显隐
      const allSeries = chart.getOption().series;
      for (const [legendName, dashName] of Object.entries(legendToDash)) {
        const visible = params.selected[legendName];
        let idx = -1;
        allSeries.forEach((s, i) => { if (s.name === dashName) idx = i; });
        if (idx >= 0) {
          if (visible) chart.dispatchAction({ type: 'showTip', seriesIndex: idx }); // just trigger refresh
        }
      }
      // 实际做法：直接 setOption 覆盖底层 series 的 data 为 null 来实现隐藏
      // 但更简单的方式是遍历重设
      const newSeries = [];
      allSeries.forEach((s, i) => {
        if (legendToDash.hasOwnProperty(s.name) || Object.values(legendToDash).includes(s.name)) {
          // 底层虚线 series
          const owner = Object.keys(legendToDash).find(k => legendToDash[k] === s.name);
          if (owner && !params.selected[owner]) {
            // 隐藏：把 data 全部设 null
            newSeries.push({ data: new Array(60).fill(null) });
          } else if (owner && params.selected[owner]) {
            // 显示：恢复原数据
            const origMap = { '__价格底层': closeFull, '__成交量底层': volFull, '__斜率底层': slopeFull, '__对数底层': logFull };
            newSeries.push({ data: origMap[s.name] });
          }
        }
      });
      if (newSeries.length > 0) {
        chart.setOption({ series: newSeries });
      }
    });
  </script>
</body>
</html>
